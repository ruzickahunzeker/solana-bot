[package]
name = "copy-trading"
version = "0.1.0"
edition = "2021"
default-run = "copy-trading"

[[bin]]
name = "copy-trading"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
hex = "0.4"
rand = "0.9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-sdk = "3.0.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
teloxide = { version = "0.14", features = ["macros", "throttle"] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["full", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.dev]
debug = 0
codegen-units = 256
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
