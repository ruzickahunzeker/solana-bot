name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Component to build
        required: true
        default: all
        type: choice
        options:
          - all
          - trade_service
          - copy_trading

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0

jobs:
  trade-service:
    name: Trade service
    if: inputs.target == 'all' || inputs.target == 'trade_service'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: trade_service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-trade-${{ hashFiles('trade_service/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-trade-
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/pump-trade-service dist/
          strip dist/pump-trade-service
          sha256sum dist/pump-trade-service > dist/pump-trade-service.sha256

      - name: Upload trade service
        uses: actions/upload-artifact@v4
        with:
          name: pump-trade-service-linux-x86_64
          path: trade_service/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  copy-trading:
    name: Copy trading
    if: inputs.target == 'all' || inputs.target == 'copy_trading'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: copy_trading
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev pkg-config

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-copy-${{ hashFiles('copy_trading/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-copy-
            ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/copy-trading dist/
          strip dist/copy-trading
          sha256sum dist/copy-trading > dist/copy-trading.sha256

      - name: Upload copy trading
        uses: actions/upload-artifact@v4
        with:
          name: copy-trading-linux-x86_64
          path: copy_trading/dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
